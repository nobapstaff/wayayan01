<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17152f">
  <title>ワヤヤンの地球侵略計画</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #17152f;
      color: #fff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #182334;
      background-image:
        linear-gradient(90deg, #ffffff08 1px, transparent 1px),
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(180deg, #243b48, #182334);
      background-size: 24px 24px, 24px 24px, auto;
    }

    button { font: inherit; }

    .game {
      width: min(100% - 28px, 760px);
      margin: 0 auto;
      padding: 26px 0 40px;
    }

    header { text-align: center; }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 5vw, 2.35rem);
      letter-spacing: .04em;
    }

    .subtitle { margin: 7px 0 22px; color: #c2bfde; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat, .panel {
      border: 2px solid #50634c;
      border-radius: 3px;
      background: #263b37;
      box-shadow: 0 4px 0 #101a1f;
    }

    .stat { padding: 12px 8px; text-align: center; }
    .stat-label { display: block; color: #bbb8d5; font-size: .78rem; }
    .stat-value { display: block; margin-top: 3px; font-size: 1.08rem; font-weight: 750; }

    .town {
      position: relative;
      overflow: hidden;
      min-height: 440px;
      padding: 20px;
      border: 3px solid #435f3f;
      border-radius: 3px;
      background:
        linear-gradient(90deg, #ffffff0b 1px, transparent 1px),
        linear-gradient(#ffffff0b 1px, transparent 1px),
        linear-gradient(180deg, transparent 0 73%, #78bd48 73% 79%, #9a693f 79% 100%),
        linear-gradient(180deg, #75b9df 0%, #b3d8dc 72%, #78bd48 72%);
      background-size: 24px 24px, 24px 24px, auto, auto;
      image-rendering: pixelated;
      text-align: center;
    }

    .town::before, .town::after {
      position: absolute;
      content: "";
      z-index: 0;
    }

    .town::before {
      top: 52px;
      left: 12%;
      width: 24px;
      height: 8px;
      background: #f4f4dc;
      box-shadow: 8px -8px 0 #f4f4dc, 16px 0 0 #f4f4dc, 48px 24px 0 #f4f4dc,
        56px 16px 0 #f4f4dc, 64px 24px 0 #f4f4dc;
    }

    .town::after {
      right: 14%;
      bottom: 21%;
      width: 18px;
      height: 26px;
      background: #4d7b3d;
      box-shadow: 0 -8px 0 #69964a, 7px -13px 0 #69964a, 16px -5px 0 #47713b;
    }

    .town-name {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 6px 13px;
      border: 2px solid #415b3a;
      border-radius: 2px;
      background: #273b32e8;
      font-size: .86rem;
      font-weight: 700;
    }

    .scene {
      position: relative;
      z-index: 1;
      height: 350px;
      overflow: hidden;
      perspective: 700px;
    }

    .road {
      position: absolute;
      right: -20px;
      bottom: 0;
      left: -20px;
      height: 82px;
      border-top: 12px solid #8cae59;
      background:
        linear-gradient(180deg, transparent 0 49%, #e6d69b 49% 53%, transparent 53%),
        repeating-linear-gradient(90deg, transparent 0 54px, #e6d69b 54px 82px, transparent 82px 132px),
        #5a6060;
      background-size: auto, auto 5px, auto;
      background-position: center, center 58%, center;
      background-repeat: no-repeat, repeat-x, no-repeat;
      box-shadow: inset 0 7px #414b4b;
    }

    .human {
      position: absolute;
      z-index: 3;
      width: 50px;
      height: 82px;
      filter: drop-shadow(0 4px 2px #17211fb0);
    }

    .human:not(.evacuating) {
      animation: human-walk .42s steps(2, end) infinite;
    }

    .human-head {
      position: absolute;
      top: 0;
      left: 12px;
      width: 26px;
      height: 26px;
      border: 2px solid #754329;
      background: linear-gradient(135deg, #ffd09a, #d98c57);
      box-shadow: inset 4px 3px #ffe2b3, 2px 3px #6d472f;
    }

    .human-head::before {
      position: absolute;
      top: -4px;
      left: -2px;
      width: 24px;
      height: 9px;
      background: linear-gradient(90deg, #553b2c, #302b2b);
      content: "";
    }

    .human-eye {
      position: absolute;
      top: 12px;
      width: 4px;
      height: 5px;
      background: #26323a;
      box-shadow: 1px 1px #fff;
    }

    .human-eye-left { left: 5px; }
    .human-eye-right { right: 5px; }

    .human-body {
      position: absolute;
      top: 26px;
      left: 8px;
      width: 34px;
      height: 31px;
      border: 2px solid #793e25;
      background: linear-gradient(90deg, #f48a45 0 48%, #d95d36 49% 100%);
      box-shadow: inset 4px 3px #ffc16b, inset -4px -3px #9e3f35;
    }

    .human-arm, .human-leg {
      position: absolute;
      border: 2px solid #5b3e2e;
    }

    .human-arm {
      top: 29px;
      width: 10px;
      height: 26px;
      background: linear-gradient(90deg, #ffd09a, #d98c57);
    }

    .human-arm-left { left: 0; transform: rotate(8deg); }
    .human-arm-right { right: 0; transform: rotate(-8deg); }

    .human-leg {
      top: 56px;
      width: 14px;
      height: 22px;
      background: linear-gradient(90deg, #45536a, #29374c);
      box-shadow: inset 3px 1px #77859a;
    }

    .human-leg-left { left: 10px; }
    .human-leg-right { right: 10px; }
    .human.evacuating {
      opacity: 0;
      animation: human-escape .18s ease-in both;
    }

    @keyframes human-walk {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -4px; }
    }

    @keyframes human-escape {
      to { opacity: 0; translate: 0 -25px; scale: .65; }
    }

    .alien {
      position: absolute;
      z-index: 2;
      top: 214px;
      left: 24px;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 30% 22%, #effff3 0 4%, #b9ffe0 12%, transparent 30%),
        radial-gradient(ellipse at 35% 30%, #a6f5d2 0, #55bd97 58%, #267d69 100%);
      box-shadow: inset -12px -14px 22px #154e49a6, inset 7px 8px 14px #ffffff78,
        7px 12px 0 #254d4b99;
      transform-style: preserve-3d;
      animation: hover 2.4s ease-in-out infinite;
      user-select: none;
    }

    .antenna {
      position: absolute;
      z-index: 1;
      top: -16px;
      width: 4px;
      height: 31px;
      border-radius: 5px;
      background: linear-gradient(90deg, #4e9d82, #d4ffe8 45%, #72c5a4);
      box-shadow: 2px 2px 0 #276850;
      transform-origin: bottom;
    }

    .antenna::after {
      position: absolute;
      top: -4px;
      left: -3px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e9fff0;
      box-shadow: 0 1px 5px #e9fff0;
      content: "";
    }

    .antenna-left { left: 43px; transform: rotate(-19deg); }
    .antenna-right { right: 43px; transform: rotate(19deg); }

    .alien-face {
      position: absolute;
      top: 39px;
      left: 50%;
      display: flex;
      width: 58px;
      height: 31px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 50%;
      background: linear-gradient(145deg, #566480, #20283b 68%);
      box-shadow: inset 3px 4px 4px #101827, inset -2px -2px 3px #8792a0,
        2px 4px 3px #164b43aa;
      transform: translateX(-50%);
    }

    .alien-eye {
      width: 7px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0 20%, #d8f4ff 35%, #7199ad 100%);
      box-shadow: 1px 2px 2px #131d2b;
    }

    .alien-arm, .alien-leg {
      position: absolute;
      z-index: 1;
      background: linear-gradient(135deg, #60677c, #292d3d 65%, #141927);
      box-shadow: inset 2px 3px 4px #ffffff52, 2px 4px 3px #00000055;
    }

    .alien-arm {
      top: 70px;
      width: 37px;
      height: 18px;
      border-radius: 6px;
    }

    .alien-arm-left { left: -17px; transform: rotate(35deg); }
    .alien-arm-right { right: -17px; transform: rotate(-35deg); }

    .alien-leg {
      bottom: -7px;
      width: 24px;
      height: 20px;
      border-radius: 50%;
    }

    .alien-leg-left { left: 27px; transform: rotate(20deg); }
    .alien-leg-right { right: 27px; transform: rotate(-20deg); }

    .voxel-city {
      --block-size: 15px;
      display: flex;
      position: absolute;
      right: 7%;
      bottom: 88px;
      height: 280px;
      align-items: end;
      gap: 4px;
      transform: rotateX(5deg);
      transform-style: preserve-3d;
    }

    .voxel-city::before {
      position: absolute;
      z-index: -1;
      right: -12%;
      bottom: 0;
      left: -12%;
      height: 42px;
      border: 2px solid #526f3e;
      background-color: #83ad4e;
      background-image:
        linear-gradient(90deg, #405c3890 1px, transparent 1px),
        linear-gradient(#405c3890 1px, transparent 1px);
      background-size: var(--block-size) var(--block-size);
      content: "";
      transform: perspective(180px) rotateX(55deg);
      transform-origin: bottom;
    }

    .laser-layer {
      position: absolute;
      z-index: 4;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .laser-beam {
      stroke: #a6fff2;
      stroke-width: 4px;
      stroke-linecap: square;
      opacity: 0;
      filter: drop-shadow(0 0 4px #5effef) drop-shadow(0 0 10px #20e5ff);
    }

    .laser-layer.firing .laser-beam {
      opacity: 1;
      animation: beam-flash .32s ease-out both;
    }

    .aim-reticle {
      position: absolute;
      z-index: 5;
      width: 26px;
      height: 26px;
      border: 2px solid #ff6969;
      box-shadow: 0 0 6px #ff4c4c, inset 0 0 5px #ff4c4c80;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .aim-reticle::before, .aim-reticle::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: #ffe5e5;
      content: "";
      transform: translate(-50%, -50%);
    }

    .aim-reticle::before { width: 34px; height: 2px; }
    .aim-reticle::after { width: 2px; height: 34px; }
    .aim-reticle.firing { animation: reticle-pulse .32s ease-out; }

    .building {
      display: grid;
      align-content: end;
      gap: 1px;
      padding: 0 1px;
      transform-style: preserve-3d;
    }

    .block {
      position: relative;
      width: var(--block-size);
      height: var(--block-size);
      transform-style: preserve-3d;
      transition: opacity .18s, transform .18s;
    }

    .block-face {
      position: absolute;
      display: block;
      border: 1px solid #ffffff2b;
      backface-visibility: hidden;
    }

    .face-front {
      inset: 0;
      transform: translateZ(calc(var(--block-size) / 2));
      background: #c68156;
      box-shadow: inset 2px 2px #ffffff35, inset -3px -3px #00000035;
    }

    .face-top {
      top: 0;
      left: 0;
      width: var(--block-size);
      height: calc(var(--block-size) / 2);
      transform: translateZ(calc(var(--block-size) / 2)) rotateX(-90deg);
      transform-origin: top;
      background: #e0a477;
    }

    .face-right {
      top: 0;
      right: 0;
      width: calc(var(--block-size) / 2);
      height: var(--block-size);
      transform: translateZ(calc(var(--block-size) / 2)) rotateY(90deg);
      transform-origin: right;
      background: #895438;
    }

    .building:nth-child(3n + 2) .face-front { background: #787f8e; }
    .building:nth-child(3n + 2) .face-top { background: #aeb6c2; }
    .building:nth-child(3n + 2) .face-right { background: #4e5667; }
    .building:nth-child(3n) .face-front { background: #bd9a62; }
    .building:nth-child(3n) .face-top { background: #e0c58d; }
    .building:nth-child(3n) .face-right { background: #816a45; }
    .block.roof .face-front { background: #5d6478; }
    .block.roof .face-top { background: #929bad; }
    .block.roof .face-right { background: #3b4357; }
    .block.window .face-front {
      background: linear-gradient(90deg, #d9c582 0 26%, #525b70 27% 72%, #d9c582 73%);
    }
    .block.destroyed {
      opacity: 0;
      transform: translate3d(8px, 10px, -12px) rotateX(35deg) rotateZ(18deg) scale(.55);
    }

    .town-message { position: relative; z-index: 1; margin: 5px 0 13px; font-weight: 650; }

    .health-track {
      position: relative;
      z-index: 1;
      overflow: hidden;
      height: 15px;
      border: 2px solid #263c32;
      border-radius: 2px;
      background: #24333b;
    }

    .health-fill {
      width: 100%;
      height: 100%;
      border-radius: 0;
      background: repeating-linear-gradient(90deg, #f1d66d 0 12px, #e99655 12px 24px);
      transition: width .25s ease;
    }

    .health-label { position: relative; z-index: 1; margin-top: 6px; font-size: .82rem; }

    .controls {
      display: grid;
      grid-template-columns: 1.15fr 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }

    .upgrade {
      min-height: 90px;
      padding: 12px;
      border: 2px solid #536848;
      border-radius: 3px;
      background: #263b37;
      color: white;
      text-align: left;
      cursor: pointer;
      transition: transform .12s, background .12s, border-color .12s;
    }

    .upgrade:hover:not(:disabled) { transform: translateY(-2px); background: #354d3d; border-color: #b2c96a; }
    .upgrade:active:not(:disabled) { transform: scale(.98); }
    .upgrade:disabled { opacity: .48; cursor: not-allowed; }
    .upgrade.primary { background: #47783f; border-color: #8fb764; text-align: center; }
    .upgrade.primary:hover:not(:disabled) { background: #588f48; }
    .upgrade-title { display: block; font-weight: 750; }
    .upgrade-detail { display: block; margin-top: 5px; color: #c7c4df; font-size: .76rem; line-height: 1.4; }
    .primary .upgrade-detail { color: #eeebff; }

    .panel { padding: 15px 17px; }
    .panel h2 { margin: 0 0 7px; font-size: 1rem; }
    .panel p { margin: 0; color: #c2bfde; font-size: .88rem; line-height: 1.6; }
    .toast { min-height: 25px; margin: 10px 0 0; color: #f4dc78; text-align: center; font-weight: 700; }
    .key-hint { margin: 8px 0 0; color: #c6d4b0; font-size: .78rem; text-align: center; }

    .movement-pad {
      display: grid;
      width: max-content;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(2, 38px);
      gap: 4px;
      margin: 8px auto 2px;
      touch-action: none;
    }

    .movement-pad button {
      border: 2px solid #718957;
      border-radius: 3px;
      background: #314638;
      color: white;
      font-size: 1.05rem;
      font-weight: 800;
      touch-action: none;
      user-select: none;
    }

    .movement-pad button:active { background: #5b8248; }
    .movement-pad button[data-move="ArrowUp"] { grid-column: 2; grid-row: 1; }
    .movement-pad button[data-move="ArrowLeft"] { grid-column: 1; grid-row: 2; }
    .movement-pad button[data-move="ArrowDown"] { grid-column: 2; grid-row: 2; }
    .movement-pad button[data-move="ArrowRight"] { grid-column: 3; grid-row: 2; }

    kbd {
      display: inline-block;
      min-width: 56px;
      padding: 3px 8px;
      border: 2px solid #a5b278;
      border-radius: 2px;
      background: #263b37;
      color: #fff;
      font: inherit;
      font-weight: 750;
      box-shadow: 0 2px 0 #101a1f;
    }

    @keyframes hover {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-9px) rotate(3deg); }
    }

    @keyframes beam-flash {
      0% { opacity: 0; stroke-width: 1px; }
      25% { opacity: 1; stroke-width: 7px; }
      100% { opacity: .8; stroke-width: 3px; }
    }

    @keyframes reticle-pulse {
      50% { scale: 1.35; }
    }

    @media (max-width: 560px) {
      .game { width: min(100% - 20px, 760px); padding-top: 20px; }
      .town { min-height: 380px; padding: 16px 12px; }
      .scene { height: 290px; }
      .alien { top: 182px; width: 94px; height: 94px; }
      .road { height: 62px; border-top-width: 9px; }
      .voxel-city { --block-size: 11px; right: 4%; bottom: 66px; height: 210px; }
      .human { scale: .9; }
      .antenna { top: -13px; height: 25px; }
      .antenna-left { left: 32px; }
      .antenna-right { right: 32px; }
      .alien-face { top: 29px; width: 46px; height: 25px; gap: 9px; }
      .alien-eye { width: 6px; height: 7px; }
      .alien-arm { top: 52px; width: 29px; height: 15px; }
      .alien-arm-left { left: -13px; }
      .alien-arm-right { right: -13px; }
      .alien-leg { bottom: -5px; width: 19px; height: 16px; }
      .alien-leg-left { left: 20px; }
      .alien-leg-right { right: 20px; }
      .voxel-city { gap: 1px; }
      .controls { grid-template-columns: 1fr 1fr; }
      .upgrade.primary { grid-column: 1 / -1; min-height: 66px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <h1>ワヤヤンの地球侵略計画</h1>
      <p class="subtitle">ブロックの街を壊して、宇宙一の侵略者をめざそう！</p>
    </header>

    <section class="stats" aria-label="侵略状況">
      <div class="stat"><span class="stat-label">撃退した人</span><span class="stat-value" id="town-count">0</span></div>
      <div class="stat"><span class="stat-label">侵略パワー</span><span class="stat-value" id="power">0</span></div>
      <div class="stat"><span class="stat-label">自動パワー</span><span class="stat-value" id="auto-power">0 / 秒</span></div>
    </section>

    <section class="town" aria-label="侵略中の町">
      <span class="town-name" id="town-name">のどかな町</span>
      <div class="scene">
        <div class="alien" role="img" aria-label="触覚とパンダのような手足がある、球体のワヤヤン">
          <span class="antenna antenna-left"></span>
          <span class="antenna antenna-right"></span>
          <span class="alien-face"><span class="alien-eye"></span><span class="alien-eye"></span></span>
          <span class="alien-arm alien-arm-left"></span>
          <span class="alien-arm alien-arm-right"></span>
          <span class="alien-leg alien-leg-left"></span>
          <span class="alien-leg alien-leg-right"></span>
        </div>
        <div class="voxel-city" id="voxel-city" aria-hidden="true"></div>
        <div class="road" aria-hidden="true"></div>
        <div id="people" aria-label="道を歩く人たち"></div>
        <svg class="laser-layer" aria-hidden="true" preserveAspectRatio="none">
          <line class="laser-beam" id="laser-beam"></line>
        </svg>
        <div class="aim-reticle" id="aim-reticle" aria-hidden="true"></div>
      </div>
      <p class="town-message" id="town-message">ワヤヤンが町にあらわれた！</p>
      <div class="health-track" role="progressbar" aria-label="町の残り体力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <div class="health-fill" id="health-fill"></div>
      </div>
      <div class="health-label" id="health-label">町の元気 100%</div>
    </section>

    <p class="toast" id="toast" aria-live="polite"></p>

    <section class="controls" aria-label="アクションと強化">
      <button class="upgrade primary" id="attack-button">
        <span class="upgrade-title"><kbd>SPACE</kbd> 🔦 ビーム</span>
        <span class="upgrade-detail" id="attack-detail">キーまたはボタンで攻撃</span>
      </button>
      <button class="upgrade" id="power-button">
        <span class="upgrade-title">✨ ワヤヤン強化</span>
        <span class="upgrade-detail" id="power-detail"></span>
      </button>
      <button class="upgrade" id="ally-button">
        <span class="upgrade-title">🛸 なかま召喚</span>
        <span class="upgrade-detail" id="ally-detail"></span>
      </button>
    </section>
    <div class="movement-pad" aria-label="ワヤヤンの移動">
      <button type="button" data-move="ArrowUp" aria-label="上へ移動">▲</button>
      <button type="button" data-move="ArrowLeft" aria-label="左へ移動">◀</button>
      <button type="button" data-move="ArrowDown" aria-label="下へ移動">▼</button>
      <button type="button" data-move="ArrowRight" aria-label="右へ移動">▶</button>
    </div>
    <p class="key-hint">道に現れる人を2秒ごとのビームで撃退。矢印キー / WASD で移動</p>

    <section class="panel">
      <h2>ワヤヤンからひとこと</h2>
      <p id="quip">「この星、ぜーんぶワヤヤンのもの！」</p>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "wayayan-idle-game-v1";
      const buildingShapes = [
        { width: 3, height: 4 },
        { width: 3, height: 6 },
        { width: 3, height: 5 },
        { width: 4, height: 7 },
        { width: 3, height: 5 },
        { width: 3, height: 3 }
      ];
      const defaults = {
        defeated: 0,
        power: 0,
        tapLevel: 0,
        allyLevel: 0,
        lastSavedAt: Date.now()
      };
      let state = loadState();
      let toastTimer;
      createCity();
      const people = [];
      const movement = {
        x: 24,
        y: 214,
        keys: new Set(),
        directionX: 1,
        targetPerson: null,
        lastFrame: 0
      };

      const elements = {
        townCount: document.getElementById("town-count"),
        power: document.getElementById("power"),
        autoPower: document.getElementById("auto-power"),
        townName: document.getElementById("town-name"),
        townMessage: document.getElementById("town-message"),
        healthFill: document.getElementById("health-fill"),
        healthTrack: document.querySelector(".health-track"),
        healthLabel: document.getElementById("health-label"),
        scene: document.querySelector(".scene"),
        alien: document.querySelector(".alien"),
        people: document.getElementById("people"),
        voxelCity: document.getElementById("voxel-city"),
        laserLayer: document.querySelector(".laser-layer"),
        laserBeam: document.getElementById("laser-beam"),
        aimReticle: document.getElementById("aim-reticle"),
        movementButtons: [...document.querySelectorAll(".movement-pad button")],
        attackButton: document.getElementById("attack-button"),
        attackDetail: document.getElementById("attack-detail"),
        powerButton: document.getElementById("power-button"),
        powerDetail: document.getElementById("power-detail"),
        allyButton: document.getElementById("ally-button"),
        allyDetail: document.getElementById("ally-detail"),
        toast: document.getElementById("toast"),
        quip: document.getElementById("quip")
      };

      function createCity() {
        const city = document.getElementById("voxel-city");
        const maxHeight = Math.max(...buildingShapes.map(({ height }) => height));

        buildingShapes.forEach(({ width, height }, buildingIndex) => {
          const building = document.createElement("div");
          building.className = "building";
          building.style.gridTemplateColumns = `repeat(${width}, var(--block-size))`;
          building.style.gridTemplateRows = `repeat(${height}, var(--block-size))`;
          city.append(building);
        });

        for (let row = maxHeight; row >= 1; row -= 1) {
          buildingShapes.forEach(({ width, height }, buildingIndex) => {
            if (row > height) return;
            const building = city.children[buildingIndex];
            for (let column = 1; column <= width; column += 1) {
              const block = document.createElement("span");
              block.className = "block";
              block.dataset.order = String(blocks.length);
              if (row === height) block.classList.add("roof");
              else if ((row + column + buildingIndex) % 3 === 0) block.classList.add("window");
              block.style.gridColumn = String(column);
              block.style.gridRow = String(height - row + 1);
              for (const face of ["front", "top", "right"]) {
                const faceElement = document.createElement("span");
                faceElement.className = `block-face face-${face}`;
                block.append(faceElement);
              }
              building.append(block);
            }
          });
        }
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!saved || !Number.isFinite(saved.power)) return { ...defaults };
          const normalized = {
            defeated: Math.max(0, Math.floor(Number.isFinite(saved.defeated) ? saved.defeated : saved.towns) || 0),
            power: Math.max(0, saved.power),
            tapLevel: Math.max(0, Math.floor(saved.tapLevel) || 0),
            allyLevel: Math.max(0, Math.floor(saved.allyLevel) || 0),
            lastSavedAt: Number.isFinite(saved.lastSavedAt) ? saved.lastSavedAt : Date.now()
          };
          const awaySeconds = Math.min(8 * 60 * 60, Math.max(0, (Date.now() - normalized.lastSavedAt) / 1000));
          const awayPower = awaySeconds * normalized.allyLevel;
          normalized.power += awayPower;
          return normalized;
        } catch (error) {
          console.warn("セーブデータを読み込めませんでした。新しく開始します。", error);
          return { ...defaults };
        }
      }

      function saveState() {
        state.lastSavedAt = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function tapDamage() {
        return 1 + state.tapLevel * 2;
      }

      function powerCost() {
        return Math.floor(10 * Math.pow(1.6, state.tapLevel));
      }

      function allyCost() {
        return Math.floor(20 * Math.pow(1.7, state.allyLevel));
      }

      function format(number) {
        return Math.floor(number).toLocaleString("ja-JP");
      }

      function showToast(message) {
        elements.toast.textContent = message;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { elements.toast.textContent = ""; }, 2200);
      }

      function defeatPerson(person) {
        if (!person || person.element.classList.contains("evacuating")) return;
        const reward = tapDamage();
        person.element.classList.add("evacuating");
        state.defeated += 1;
        state.power += reward;
        movement.targetPerson = null;
        elements.quip.textContent = "「みんな逃げていったね。次は誰かな？」";
        showToast(`人を撃退！ +${format(reward)} パワー`);
        setTimeout(() => {
          person.element.remove();
          const index = people.indexOf(person);
          if (index >= 0) people.splice(index, 1);
          render();
        }, 180);
        render();
      }

      function createPerson() {
        if (people.length >= 4) return;
        const person = document.createElement("div");
        person.className = "human";
        person.setAttribute("role", "img");
        person.setAttribute("aria-label", "道を歩く人");
        person.innerHTML = '<span class="human-head"><span class="human-eye human-eye-left"></span><span class="human-eye human-eye-right"></span></span><span class="human-body"></span><span class="human-arm human-arm-left"></span><span class="human-arm human-arm-right"></span><span class="human-leg human-leg-left"></span><span class="human-leg human-leg-right"></span>';
        elements.people.append(person);
        const sceneRect = elements.scene.getBoundingClientRect();
        const alienRect = elements.alien.getBoundingClientRect();
        const alienX = alienRect.left - sceneRect.left;
        const x = alienX > sceneRect.width / 2 ? -40 : sceneRect.width + 8;
        const direction = x < 0 ? 1 : -1;
        const roadRect = elements.scene.querySelector(".road").getBoundingClientRect();
        const y = roadRect.top - sceneRect.top + (roadRect.height - person.offsetHeight) / 2;
        person.style.left = `${x}px`;
        person.style.top = `${y}px`;
        people.push({ element: person, x, y, direction, speed: 24 + Math.random() * 16 });
      }

      function render() {
        const nextPowerCost = powerCost();
        const nextAllyCost = allyCost();

        elements.townCount.textContent = format(state.defeated);
        elements.power.textContent = format(state.power);
        elements.autoPower.textContent = `${format(state.allyLevel)} / 秒`;
        elements.townName.textContent = "地球の町";
        elements.townMessage.textContent = people.length > 0 ? "道に人が現れた！照準を合わせよう！" : "道に人が現れるのを待っている……";
        const crowd = Math.min(100, people.length * 25);
        elements.healthFill.style.width = `${crowd}%`;
        elements.healthLabel.textContent = `道にいる人 ${people.length} / 4 人`;
        elements.healthTrack.setAttribute("aria-valuenow", String(crowd));
        elements.attackDetail.textContent = `撃退で +${format(tapDamage())} パワー`;
        elements.powerDetail.textContent = `攻撃力 +2　｜　${format(nextPowerCost)} パワー`;
        elements.allyDetail.textContent = `毎秒 +1 パワー　｜　${format(nextAllyCost)} パワー`;
        elements.powerButton.disabled = state.power < nextPowerCost;
        elements.allyButton.disabled = state.power < nextAllyCost;
      }

      function updateAim() {
        const sceneRect = elements.scene.getBoundingClientRect();
        const alienRect = elements.alien.getBoundingClientRect();
        elements.laserLayer.setAttribute("viewBox", `0 0 ${sceneRect.width} ${sceneRect.height}`);
        const startX = alienRect.left - sceneRect.left + alienRect.width / 2;
        const startY = alienRect.top - sceneRect.top + alienRect.height / 2;
        const activePeople = people.filter(({ element }) => !element.classList.contains("evacuating"));
        if (!movement.targetPerson || !activePeople.includes(movement.targetPerson)) {
          const ahead = activePeople.filter((person) => {
            const rect = person.element.getBoundingClientRect();
            const x = rect.left - sceneRect.left + rect.width / 2;
            return (x - startX) * movement.directionX > 0;
          });
          const pool = ahead.length > 0 ? ahead : activePeople;
          pool.sort((a, b) => {
            const rectA = a.element.getBoundingClientRect();
            const rectB = b.element.getBoundingClientRect();
            const distanceA = Math.hypot(rectA.left + rectA.width / 2 - alienRect.left - alienRect.width / 2, rectA.top + rectA.height / 2 - alienRect.top - alienRect.height / 2);
            const distanceB = Math.hypot(rectB.left + rectB.width / 2 - alienRect.left - alienRect.width / 2, rectB.top + rectB.height / 2 - alienRect.top - alienRect.height / 2);
            return distanceA - distanceB;
          });
          movement.targetPerson = pool[0] ?? null;
        }

        const targetRect = movement.targetPerson?.element.getBoundingClientRect();
        const targetX = targetRect
          ? targetRect.left - sceneRect.left + targetRect.width / 2
          : startX + movement.directionX * 100;
        const targetY = targetRect
          ? targetRect.top - sceneRect.top + targetRect.height / 2
          : startY;

        elements.laserBeam.setAttribute("x1", String(startX));
        elements.laserBeam.setAttribute("y1", String(startY));
        elements.laserBeam.setAttribute("x2", String(targetX));
        elements.laserBeam.setAttribute("y2", String(targetY));
        elements.aimReticle.style.left = `${targetX}px`;
        elements.aimReticle.style.top = `${targetY}px`;
        return { startX, startY, targetX, targetY, sceneRect };
      }

      function lineHitsRect(startX, startY, endX, endY, rect) {
        const dx = endX - startX;
        const dy = endY - startY;
        let min = 0;
        let max = 1;
        const boundaries = [
          [-dx, startX - rect.left],
          [dx, rect.right - startX],
          [-dy, startY - rect.top],
          [dy, rect.bottom - startY]
        ];

        for (const [direction, distance] of boundaries) {
          if (direction === 0) {
            if (distance < 0) return false;
            continue;
          }
          const intersection = distance / direction;
          if (direction < 0) min = Math.max(min, intersection);
          else max = Math.min(max, intersection);
          if (min > max) return false;
        }
        return true;
      }

      function beamHitsPerson(aim) {
        const hits = people.flatMap((person) => {
          if (person.element.classList.contains("evacuating")) return [];
          const rect = person.element.getBoundingClientRect();
          const localRect = {
            left: rect.left - aim.sceneRect.left,
            right: rect.right - aim.sceneRect.left,
            top: rect.top - aim.sceneRect.top,
            bottom: rect.bottom - aim.sceneRect.top
          };
          if (!lineHitsRect(aim.startX, aim.startY, aim.targetX, aim.targetY, localRect)) return [];
          return [{
            person,
            distance: Math.hypot(
              localRect.left + (localRect.right - localRect.left) / 2 - aim.startX,
              localRect.top + (localRect.bottom - localRect.top) / 2 - aim.startY
            )
          }];
        });
        hits.sort((a, b) => a.distance - b.distance);
        return hits[0]?.person ?? null;
      }

      function fireBeam() {
        const aim = updateAim();
        elements.laserLayer.classList.remove("firing");
        elements.aimReticle.classList.remove("firing");
        void elements.laserLayer.getBoundingClientRect();
        elements.laserLayer.classList.add("firing");
        elements.aimReticle.classList.add("firing");
        setTimeout(() => {
          elements.laserLayer.classList.remove("firing");
          elements.aimReticle.classList.remove("firing");
        }, 360);
        const hitPerson = beamHitsPerson(aim);
        if (hitPerson) {
          movement.targetPerson = null;
          defeatPerson(hitPerson);
        } else {
          showToast("ビームが人に当たらなかった！");
        }
      }

      function moveAlien(timestamp) {
        const elapsed = movement.lastFrame ? Math.min((timestamp - movement.lastFrame) / 1000, 0.05) : 0;
        movement.lastFrame = timestamp;
        let horizontal = 0;
        let vertical = 0;
        if (movement.keys.has("ArrowLeft") || movement.keys.has("KeyA")) horizontal -= 1;
        if (movement.keys.has("ArrowRight") || movement.keys.has("KeyD")) horizontal += 1;
        if (movement.keys.has("ArrowUp") || movement.keys.has("KeyW")) vertical -= 1;
        if (movement.keys.has("ArrowDown") || movement.keys.has("KeyS")) vertical += 1;

        const hasManualDirection = horizontal !== 0 || vertical !== 0;
        if (!hasManualDirection) {
          horizontal = movement.directionX;
          vertical = 0;
        } else if (horizontal !== 0) {
          movement.directionX = Math.sign(horizontal);
        }

        const distance = 75 * elapsed / (Math.hypot(horizontal, vertical) || 1);
        movement.x += horizontal * distance;
        movement.y += vertical * distance;
        const maxX = Math.max(0, elements.scene.clientWidth - elements.alien.offsetWidth);
        const sceneRect = elements.scene.getBoundingClientRect();
        const roadRect = elements.scene.querySelector(".road").getBoundingClientRect();
        const roadY = roadRect.top - sceneRect.top + (roadRect.height - elements.alien.offsetHeight) / 2;
        const maxY = Math.max(0, Math.min(elements.scene.clientHeight - elements.alien.offsetHeight, roadY));
        if (movement.x < 0 || movement.x > maxX) {
          movement.directionX *= -1;
          movement.x = Math.max(0, Math.min(movement.x, maxX));
          movement.targetPerson = null;
        }
        movement.x = Math.max(0, Math.min(movement.x, maxX));
        if (!hasManualDirection) movement.y += (maxY - movement.y) * Math.min(elapsed * 5, 1);
        movement.y = Math.max(0, Math.min(movement.y, maxY));
        for (let index = people.length - 1; index >= 0; index -= 1) {
          const person = people[index];
          person.x += person.direction * person.speed * elapsed;
          const personWidth = person.element.offsetWidth;
          if (person.x < -personWidth - 4 || person.x > elements.scene.clientWidth + 4) {
            person.element.remove();
            people.splice(index, 1);
            if (movement.targetPerson === person) movement.targetPerson = null;
            render();
          } else {
            person.element.style.left = `${person.x}px`;
          }
        }
        if (movement.targetPerson) {
          const targetRect = movement.targetPerson.element.getBoundingClientRect();
          const alienX = movement.x + elements.alien.offsetWidth / 2;
          const targetX = targetRect.left - sceneRect.left + targetRect.width / 2;
          if ((targetX - alienX) * movement.directionX < 0) movement.targetPerson = null;
        }
        elements.alien.style.left = `${movement.x}px`;
        elements.alien.style.top = `${movement.y}px`;
        updateAim();
        requestAnimationFrame(moveAlien);
      }

      elements.attackButton.addEventListener("click", fireBeam);
      document.addEventListener("keydown", (event) => {
        if (event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable='true']")) return;
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "KeyA", "KeyD", "KeyW", "KeyS"].includes(event.code)) {
          event.preventDefault();
          movement.keys.add(event.code);
          return;
        }
        if (event.code !== "Space" || event.repeat) return;
        if (event.target instanceof Element && event.target.closest("button, a")) return;
        event.preventDefault();
        fireBeam();
      });
      document.addEventListener("keyup", (event) => movement.keys.delete(event.code));
      window.addEventListener("blur", () => movement.keys.clear());
      elements.movementButtons.forEach((button) => {
        const key = button.dataset.move;
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          movement.keys.add(key);
        });
        const stopMovement = () => movement.keys.delete(key);
        button.addEventListener("pointerup", stopMovement);
        button.addEventListener("pointercancel", stopMovement);
        button.addEventListener("lostpointercapture", stopMovement);
      });
      elements.powerButton.addEventListener("click", () => {
        const cost = powerCost();
        if (state.power < cost) return;
        state.power -= cost;
        state.tapLevel += 1;
        showToast("ワヤヤンの攻撃力がアップ！");
        render();
      });
      elements.allyButton.addEventListener("click", () => {
        const cost = allyCost();
        if (state.power < cost) return;
        state.power -= cost;
        state.allyLevel += 1;
        showToast("なかまが加わった！");
        render();
      });

      setInterval(() => {
        if (state.allyLevel > 0) {
          state.power += state.allyLevel;
          render();
        }
      }, 1000);
      createPerson();
      setInterval(() => {
        createPerson();
        render();
      }, 2600);
      setInterval(fireBeam, 2000);
      setInterval(saveState, 5000);
      window.addEventListener("beforeunload", saveState);
      render();
      requestAnimationFrame(moveAlien);
      saveState();
    })();
  </script>
</body>
</html>
